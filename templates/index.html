<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Listener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        #chat {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #ddd;
        }
        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 20px;
            clear: both;
            word-wrap: break-word;
        }
        .message.you {
            background-color: #dcf8c6;
            float: right;
            text-align: right;
        }
        .message.other {
            background-color: #ececec;
            float: left;
            text-align: left;
        }
        .suggestion {
            font-size: 0.85em;
            color: #666;
            margin-top: 5px;
            font-style: italic;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background: #eee;
        }
        #messageInput {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 1em;
            outline: none;
        }
        #sendBtn {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            background-color: #4caf50;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #sendBtn:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }
        #startChatBtn {
            margin: 20px auto;
            padding: 10px 30px;
            font-size: 1em;
            border: none;
            background-color: #2196f3;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: block;
        }
        #startChatBtn:disabled {
            background-color: #90caf9;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <button id="startChatBtn">Start Chat</button>
    <div id="chat-container" style="display:none;">
        <div id="chat"></div>
        <div id="input-area">
            <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" />
            <button id="sendBtn" disabled>Send</button>
        </div>
    </div>

    <script>
        let userId = null;
        let otherUserId = null;

        const chatContainer = document.getElementById('chat-container');
        const chatDiv = document.getElementById('chat');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const startChatBtn = document.getElementById('startChatBtn');

        startChatBtn.onclick = async () => {
            const response = await fetch('/start_chat', { method: 'POST' });
            const data = await response.json();
            userId = data.user_id;
            otherUserId = prompt("Enter the other user's ID to chat with:");
            if (!otherUserId) {
                alert("Other user ID is required.");
                return;
            }
            chatDiv.innerHTML = '';
            sendBtn.disabled = false;
            startChatBtn.disabled = true;
            chatContainer.style.display = 'flex';
            loadChatHistory();
        };

        sendBtn.onclick = async () => {
            const message = messageInput.value.trim();
            if (!message) return;
            const response = await fetch('/send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    user_id: userId,
                    receiver_id: otherUserId,
                    message: message
                })
            });
            const data = await response.json();
            if (data.error) {
                alert("Error: " + data.error);
                return;
            }
            appendMessage(userId, otherUserId, message, data.suggestion);
            messageInput.value = '';
            loadChatHistory();
        };

        async function loadChatHistory() {
            if (!userId || !otherUserId) return;
            const response = await fetch(`/get_chat_history?user_id=${userId}&other_user_id=${otherUserId}`);
            const data = await response.json();
            if (data.error) {
                alert("Error: " + data.error);
                return;
            }
            chatDiv.innerHTML = '';
            data.chat_history.forEach(msg => {
                appendMessage(msg.sender, msg.receiver, msg.message, msg.suggestion);
            });
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }

        function appendMessage(sender, receiver, message, suggestion) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ' + (sender === userId ? 'you' : 'other');
            msgDiv.textContent = message;
            if (suggestion) {
                const suggestionDiv = document.createElement('div');
                suggestionDiv.className = 'suggestion';
                suggestionDiv.textContent = 'Suggestion: ' + suggestion;
                msgDiv.appendChild(suggestionDiv);
            }
            chatDiv.appendChild(msgDiv);
        }
    </script>
</body>
</html>
