<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Listener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #input-container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        #input-container input {
            padding: 10px 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1em;
            width: 40%;
            outline: none;
        }
        #okBtn {
            padding: 10px 30px;
            font-size: 1em;
            border: none;
            background-color: #2196f3;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #okBtn:disabled {
            background-color: #90caf9;
            cursor: not-allowed;
        }
        #chat-suggestion-container {
            flex: 1;
            display: none;
            max-width: 900px;
            margin: 20px auto;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            gap: 10px;
            height: 70vh;
        }
        #chat {
            flex: 3.5;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 20px;
            clear: both;
            word-wrap: break-word;
        }
        .message.you {
            background-color: #dcf8c6;
            align-self: flex-end;
            text-align: right;
        }
        .message.other {
            background-color: #ececec;
            align-self: flex-start;
            text-align: left;
        }
        #suggestion-box {
            flex: 1.5;
            padding: 20px;
            overflow-y: auto;
            font-size: 0.9em;
            color: #444;
            background-color: #fafafa;
            border-left: 1px solid #ddd;
        }
        #suggestion-box h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: bold;
            color: #2196f3;
        }
        #input-area {
            display: flex;
            padding: 10px;
            background: #eee;
            border-top: 1px solid #ddd;
        }
        #messageInput {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: 1px solid #ccc;
            font-size: 1em;
            outline: none;
        }
        #sendBtn {
            margin-left: 10px;
            padding: 10px 20px;
            border: none;
            background-color: #4caf50;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        #sendBtn:disabled {
            background-color: #9e9e9e;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div id="input-container">
        <input type="text" id="senderIdInput" placeholder="Sender ID" autocomplete="off" />
        <input type="text" id="receiverIdInput" placeholder="Receiver ID" autocomplete="off" />
        <button id="okBtn">OK</button>
    </div>

    <div id="chat-suggestion-container">
        <div id="chat"></div>
        <div id="suggestion-box">
            <h3>Message Suggestions</h3>
            <ul id="suggestion-list"></ul>
        </div>
    </div>

    <div id="input-area" style="max-width: 900px; margin: 0 auto; display:none;">
        <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" />
        <button id="sendBtn" disabled>Send</button>
    </div>

   <script>
    let userId = null;
    let otherUserId = null;

    const senderIdInput = document.getElementById('senderIdInput');
    const receiverIdInput = document.getElementById('receiverIdInput');
    const okBtn = document.getElementById('okBtn');

    const chatSuggestionContainer = document.getElementById('chat-suggestion-container');
    const chatDiv = document.getElementById('chat');
    const suggestionList = document.getElementById('suggestion-list');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const inputArea = document.getElementById('input-area');

    okBtn.onclick = () => {
        const sender = senderIdInput.value.trim();
        const receiver = receiverIdInput.value.trim();

        if (!sender || !receiver) {
            alert("Both Sender ID and Receiver ID are required.");
            return;
        }

        userId = sender;
        otherUserId = receiver;

        document.getElementById('input-container').style.display = 'none';
        chatSuggestionContainer.style.display = 'flex';
        inputArea.style.display = 'flex';
        sendBtn.disabled = false;

        loadChatHistory(); // Load everything fresh
        loadLatestSuggestion(); // Load latest suggestion
        setInterval(loadChatHistory, 5000); // Load chat history every 5 seconds
        setInterval(loadLatestSuggestion, 5000); // Load latest suggestion every 5 seconds
    };

    sendBtn.onclick = async () => {
    const message = messageInput.value.trim();
    if (!message) return;

    const response = await fetch('/send_message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            user_id: userId,
            receiver_id: otherUserId,
            message: message
        })
    });

    const data = await response.json();
    if (data.error) {
        alert("Error: " + data.error);
        return;
    }

    appendMessage(userId, message); // Just append what you sent
    updateSuggestions(data.suggestions || []); // Only if backend returns

    messageInput.value = '';
    sendBtn.disabled = true;
};


    async function loadChatHistory() {
    const response = await fetch(`/get_chat_history?user_id=${userId}&other_user_id=${otherUserId}`);
    const data = await response.json();

    if (data.error) {
        alert("Error: " + data.error);
        return;
    }

    chatDiv.innerHTML = '';
    data.chat_history.forEach(msg => {
        appendMessage(msg.sender, msg.message);
    });
    chatDiv.scrollTop = chatDiv.scrollHeight;
}
async function loadLatestSuggestion() {
    const response = await fetch(`/get_latest_suggestion?user_id=${userId}&other_user_id=${otherUserId}`);
    const data = await response.json();

    if (data.latest_suggestion) {
        updateSuggestions([data.latest_suggestion]);
    } else {
        suggestionList.innerHTML = '<li>No suggestion found</li>';
    }
}
    setInterval(loadLatestSuggestion, 5000); // Load latest suggestion every 5 seconds

    function appendMessage(sender, message) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message ' + (sender === userId ? 'you' : 'other');
        msgDiv.textContent = message;
        chatDiv.appendChild(msgDiv);
    }

    function updateSuggestions(suggestions) {
        suggestionList.innerHTML = '';
        suggestions.forEach(suggestion => {
            const li = document.createElement('li');
            li.textContent = suggestion;
            suggestionList.appendChild(li);
        });
    }

    messageInput.addEventListener('input', () => {
        sendBtn.disabled = messageInput.value.trim() === '';
    });
</script>

</body>
</html>
